name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # No se conecta a ninguna DB en este paso (prisma generate y el build
          # no hacen queries) — valor no-URL a propósito para no gatillar
          # falsos positivos de escaneo de secretos.
          DATABASE_URL: unused-in-ci-build
          AUTH_SECRET: unused-in-ci-build
